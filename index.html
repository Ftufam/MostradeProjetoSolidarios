<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mostra de Projetos Solidários – Chamada simulada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fd;--surface:#ffffff;--surface-2:#edf1fb;--ink:#1c2442;--muted:#56617f;--line:#d5dcef;
  --blue:#d3e3fb;--blue-d:#2c5aa8;--gold:#f7e6a6;--gold-d:#876200;--green:#cfecd8;--green-d:#1d6b41;--violet:#e4dafa;--violet-d:#5a3fa3;
  --brand:#2c5aa8;--brand-ink:#ffffff;--leaf:#1d6b41;--sun:#e0b63a;--danger:#b3261e;--warn:#876200;
  --head:#dfeafc;--head-ink:#1c2442;--head-muted:#4d5878;--focus:#7a5fd0;
  --ok-bg:#e0f4e7;--warn-bg:#fcf3d2;--bad-bg:#fbe2df;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,h4{font-family:Archivo,"Public Sans",system-ui,sans-serif;line-height:1.15;margin:0}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
p{margin:.5em 0}
p,li,.help,.note,.lead,td .small,.panel .small,.panel .muted,textarea{text-align:justify;hyphens:auto}
.fig,.tag,th,td.num,.status,.bar+span{text-align:left;hyphens:manual}
img,table{max-width:100%}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* cabeçalho */
.top{background:var(--head);color:var(--head-ink)}
.top .wrap{display:flex;gap:18px;align-items:center;padding-top:16px;padding-bottom:14px;flex-wrap:wrap}
.logos{display:flex;gap:8px;background:#fff;border-radius:6px;padding:6px 10px;align-items:center}
.logos img{height:50px;width:auto;display:block}
.top h1{font-size:clamp(1.25rem,2.6vw,1.8rem);font-weight:800;letter-spacing:-.015em}
.top .sub{color:var(--head-muted);font-size:.92rem;margin-top:3px}
.top .ttl{flex:1;min-width:230px}
.status{font-size:.82rem;color:var(--head-muted);text-align:right}
.status b{color:var(--head-ink);font-weight:600}
nav.main{background:var(--head);border-top:1px solid #ffffff22;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav.main .wrap{display:flex;gap:4px;overflow-x:auto}
nav.main button{background:none;border:0;color:var(--head-muted);padding:12px 16px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.main button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sun)}
nav.main button:hover{color:var(--ink)}
main{padding:26px 0 70px}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
.panel>h3:first-child,.panel>h2:first-child{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.muted{color:var(--muted)}.small{font-size:.86rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:7px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:5px}
.x:hover{color:var(--danger);background:var(--bad-bg)}
label.f{display:block;font-size:.86rem;font-weight:600;margin-bottom:12px}
label.f span.h{font-weight:400;color:var(--muted);display:block}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=time],input[type=month],input[type=password],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:4px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
textarea.tall{min-height:260px}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--leaf)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--danger)}
.note{border-left:4px solid var(--sun);background:var(--warn-bg);padding:10px 14px;border-radius:0 7px 7px 0;margin:0 0 16px;font-size:.93rem}
.note.info{border-color:var(--brand);background:var(--surface-2)}
.note.bad{border-color:var(--danger);background:var(--bad-bg)}
.note.ok{border-color:var(--leaf);background:var(--ok-bg)}
.help{color:var(--muted);font-size:.92rem;border-left:3px solid var(--brand);padding-left:12px;margin:8px 0 14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.ed td{padding:4px}
table.ed input,table.ed select,table.ed textarea{margin:0;padding:6px 7px;min-width:90px}
table.ed textarea{min-height:38px;height:38px}table.ed select{min-width:150px}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}

/* régua de prazos – elemento central */
.hero{display:grid;gap:8px;margin-bottom:22px}
.hero h2{font-size:clamp(1.5rem,4.4vw,2.9rem)}
.hero .lead{color:var(--muted);font-size:1.05rem}
.ruler{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 0 24px;border-top:4px solid var(--line);position:relative}
.ruler .m{padding:14px 12px 4px 0;position:relative}
.ruler .m::before{content:"";position:absolute;top:-11px;left:0;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.ruler .m.done::before{background:var(--leaf);border-color:var(--leaf)}
.ruler .m.next::before{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 30%,transparent)}
.ruler .d{font-family:Archivo,sans-serif;font-weight:800;font-size:1.25rem}
.ruler .l{font-size:.9rem;color:var(--muted)}
.ruler .m.next .l{color:var(--ink);font-weight:600}
@media(max-width:720px){.ruler{grid-template-columns:1fr;border-top:0;border-left:4px solid var(--line);margin-left:9px}
  .ruler .m{padding:0 0 16px 22px}.ruler .m::before{top:4px;left:-11px}}
.fig{font-family:Archivo,sans-serif;font-weight:800;font-size:1.6rem;line-height:1.1}
ol.crit{margin:0;padding-left:1.3em}ol.crit li{margin-bottom:6px}

/* equipe */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 15px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bar{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--leaf)}
.editor{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:calc(100vh - 80px);overflow:auto}
.secnav button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:.92rem}
.secnav button[aria-pressed="true"]{background:var(--surface-2);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.on{background:var(--leaf);border-color:var(--leaf)}
@media(max-width:860px){.editor{grid-template-columns:1fr}.secnav{position:static;display:flex;overflow-x:auto;max-height:none}.secnav button{width:auto;white-space:nowrap}}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card h4{font-size:1.05rem;margin-bottom:2px}
.mon{width:26px;height:26px;margin:0;accent-color:var(--leaf)}
table.crono th.mm{text-align:center;padding:4px 2px;font-size:.72rem}
table.crono td.mm{text-align:center;padding:4px 2px}
.wc.over{color:var(--danger);font-weight:700}
.doc{background:#fff;color:#000;font:10.5pt/1.4 Arial,Helvetica,sans-serif;padding:28px;border:1px solid var(--line);border-radius:4px;text-align:justify}
.doc h1{font:700 14pt Arial;text-align:center;margin:10px 0 14px}.doc h2{font:700 10.5pt Arial;margin:14px 0 4px;letter-spacing:0}
.doc table{font-size:10pt;margin:6px 0}.doc th,.doc td{border:1px solid #444;padding:3px 5px;color:#000;white-space:normal}.doc th{background:#e8eef0}
.doc .lg{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444;padding-bottom:6px}.doc .lg img{height:56px}
.doc p{white-space:pre-wrap;margin:4px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:22px;max-width:min(440px,92vw);width:100%}
dialog::backdrop{background:#0009}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:720px){
  .wrap{padding:0 14px}.panel{padding:14px}main{padding-top:18px}
  .top .wrap{gap:10px}.logos img{height:38px}.status{text-align:left;width:100%}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;flex:none}
  .row>.btn{flex:1 1 auto}
  table.ed,table.ed tbody,table.ed tfoot{display:block;width:100%}table.ed thead{display:none}
  table.ed tr{display:block;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;background:var(--surface)}
  table.ed td{display:block;border:0;padding:4px 0!important;width:auto!important;min-width:0!important}
  table.ed td[data-l]::before{content:attr(data-l);display:block;font-size:.78rem;font-weight:600;color:var(--muted)}
  table.ed td:empty{display:none}
  table.ed input,table.ed select,table.ed textarea{min-width:0;width:100%}
  table.crono tr{display:flex;flex-wrap:wrap;gap:2px 0}table.crono td:first-child{flex:0 0 100%}
  table.crono td.mm{flex:0 0 16.66%;text-align:center}table.crono td.mm::before{text-align:center}
  table.crono td:last-child{flex:0 0 100%;text-align:right}
  .doc{padding:14px;min-width:560px}
}
.editor>*,.grid>*,.row>*{min-width:0}.panel{min-width:0;max-width:100%}.scroll{max-width:100%}html,body{overflow-x:hidden}.tag{white-space:normal;max-width:100%}
/* ---- tema claro: dourado, azul, verde e violeta ---- */
.top{background:linear-gradient(100deg,var(--blue) 0%,var(--violet) 55%,var(--green) 100%);border-bottom:4px solid var(--sun)}
.top .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(8px,2.5vw,24px);padding-top:12px;padding-bottom:12px;flex-wrap:nowrap}
.top .lg{background:#fff;border-radius:10px;padding:6px 10px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 #0000000d}
.top .lg img{height:clamp(40px,9vw,76px);width:auto;display:block}
.top .ttl{min-width:0;text-align:center}
.top h1{font-size:clamp(1.05rem,4.2vw,2.3rem);font-weight:800;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
nav.main{background:#f3effd;border-top:0;border-bottom:1px solid var(--line)}
nav.main .wrap{align-items:center}
#nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.status{font-size:.78rem;color:var(--muted);text-align:right;white-space:nowrap;padding:4px 0}
.status b{color:var(--green-d);font-weight:600}
.btn{background:var(--blue);color:#173a78;border-color:#9dbdf0}
.btn:hover{filter:none;background:#bdd4f8}
.btn.ghost{background:#fff;color:var(--violet-d);border-color:#c9b9f1}
.btn.ghost:hover{background:var(--violet)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
.btn.gold{background:var(--gold);color:#5c4300;border-color:#e0c25a}
.tabs button[aria-pressed="true"]{background:var(--violet);color:#3c2880;border-color:#bca9ee}
.secnav button[aria-pressed="true"]{background:var(--gold);color:#4f3a00}
.bar{background:var(--surface-2)}.bar i{background:#5fbf86}
.help{border-left-color:#9dbdf0}
.note.info{background:#e9f1fe;border-color:#9dbdf0}
.note.violet{background:#f1ebfd;border-color:#bca9ee}
.g3>.panel:nth-child(4n+1){background:#eaf2fe;border-color:#c3d8f8}
.g3>.panel:nth-child(4n+2){background:#fdf6da;border-color:#ecd98e}
.g3>.panel:nth-child(4n+3){background:#e6f6ec;border-color:#b9e0c6}
.g3>.panel:nth-child(4n+4){background:#f1ebfd;border-color:#d3c5f5}
.panel>h3:first-child{color:#23407a}
.hero h2{color:#23407a}
.ed-line{display:inline-block;background:var(--gold);color:#5c4300;font-weight:700;border-radius:99px;padding:3px 14px;font-size:.9rem;justify-self:start}
.card:hover{border-color:#bca9ee;background:#faf8ff}
dialog{border-top:5px solid var(--sun)}
#toast{background:#2b2f55;color:#fff}
.thread{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:min(640px,88%);padding:9px 13px;border-radius:12px;border:1px solid var(--line)}
.msg .who{font-size:.76rem;font-weight:700;color:var(--muted)}
.msg p{margin:2px 0 0;white-space:pre-wrap}
.msg.prof{background:#fdf6da;border-color:#ecd98e;align-self:flex-start}
.msg.team{background:#eaf2fe;border-color:#c3d8f8;align-self:flex-end}
.badge{display:inline-block;min-width:1.4em;text-align:center;background:var(--sun);color:#3d2c00;border-radius:99px;font-size:.74rem;font-weight:800;padding:0 6px;margin-left:5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--green-d)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:#3fae6e;box-shadow:0 0 0 4px #3fae6e33}
@media(max-width:1024px){.wrap{padding:0 16px}.editor{grid-template-columns:210px 1fr}}
@media(max-width:860px){.editor{grid-template-columns:1fr}}
@media(max-width:720px){nav.main .wrap{flex-wrap:wrap}.status{width:100%;text-align:left;white-space:normal;padding:0 0 6px}
  .top .lg{padding:4px 6px;border-radius:8px}.msg{max-width:100%}.fig{font-size:1.25rem}}
@media(max-width:420px){.top .wrap{gap:6px;padding-left:10px;padding-right:10px}nav.main button{padding:10px 10px;font-size:.92rem}h2{font-size:1.25rem}}
@media(min-width:1500px){.wrap{max-width:1320px}}
td.small,td .small{text-align:left;hyphens:manual}td .btn{margin:2px 0}
.top .dev{font-size:clamp(.66rem,1.9vw,.86rem);color:var(--head-muted);margin-top:4px;font-weight:500}
.fileline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ilu{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;background:#fbfaff}
.ilu-img{max-width:100%;max-height:440px;display:block;margin:6px auto;border-radius:6px;background:#fff}
table.grid-t{width:auto;min-width:100%}table.grid-t td{padding:3px;border:0}
table.grid-t input{min-width:110px;margin:0;padding:6px 7px}table.grid-t tr:first-child input{font-weight:700;background:#eaf2fe}
.doc img{max-width:100%;height:auto}.doc .cap{text-align:center;font-weight:700;margin-top:10px}.doc .src{text-align:center;font-size:9pt}
table.plan td,table.plan th{padding:5px 8px}table.plan tr.grp td{background:#eaf2fe;font-weight:700;color:#23407a}table.plan tr.sub td{background:#fdf6da;font-weight:700}table.plan tr.tot td{background:#e6f6ec;font-weight:800;border-top:2px solid var(--ink)}
details.plan>summary{cursor:pointer;font-weight:700;color:var(--violet-d);padding:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .fig{font-size:clamp(1.25rem,3.4vw,1.75rem)}.kpi .l{font-size:.84rem;color:var(--muted);text-align:left}.kpi .s{font-size:.8rem;color:var(--muted);text-align:left;margin-top:2px}
.kpi.b{background:#eaf2fe;border-color:#c3d8f8}.kpi.g{background:#fdf6da;border-color:#ecd98e}.kpi.v{background:#e6f6ec;border-color:#b9e0c6}.kpi.p{background:#f1ebfd;border-color:#d3c5f5}
.hb{display:grid;grid-template-columns:minmax(110px,40%) 1fr 104px;gap:10px;align-items:center;padding:5px 0;font-size:.9rem}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.hb .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:.84rem;text-align:right}
.hb .t{height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex;position:relative}
.hb .t i{display:block;height:100%}.c-b{background:#7fa9ea}.c-g{background:#e6c85a}.c-v{background:#6cc592}.c-p{background:#a993e6}.c-r{background:#e58d85}.c-n{background:#d5dcef}
.hb .t .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:#b3261e}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:4px 0 8px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
@media(max-width:520px){.hb{grid-template-columns:1fr auto;gap:2px 8px}.hb .n{grid-column:1}.hb .v{grid-column:2;grid-row:1}.hb .t{grid-column:1/-1}}
@media print{nav.main,.tabs,.btn,.status,#toast{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function fbAdapter(root){
  /* dados de trabalho em /mostra_ps; notas em /mostra_ps_prof; edições encerradas em /mostra_ps_arq */
  const area=p=>{const k=p.split('/')[0];return k==='evals'||k==='arquivo_prof'||k==='codes'?'mostra_ps_prof':k==='arquivo'||k==='arquivo_files'?'mostra_ps_arq':'mostra_ps'};
  const req=async(m,p,body)=>{let r;try{r=await fetch(root+'/'+area(p)+'/'+p+'.json',{method:m,body:body===undefined?undefined:JSON.stringify(body)})}catch(e){S.fbOk=false;renderStatus();throw{code:'unavailable'}}
    if(r.status===401||r.status===403)throw{code:'invalid_argument'};if(!r.ok)throw{code:'unavailable'};S.fbOk=true;return r.json()};
  const streams={};
  function stream(name){if(streams[name])return streams[name];const st={cache:null,ready:false,subs:[]};streams[name]=st;const es=new EventSource(root+'/'+name+'.json');
    const fire=()=>st.subs.forEach(f=>f());
    const h=patch=>ev=>{let o;try{o=JSON.parse(ev.data)}catch(e){return}if(!o)return;const ks=String(o.path||'/').split('/').filter(Boolean),data=o.data;
      if(!ks.length){st.cache=patch&&st.cache&&typeof st.cache==='object'?Object.assign(st.cache,data):data}
      else{if(!st.cache||typeof st.cache!=='object')st.cache={};let a=st.cache;for(let i=0;i<ks.length-1;i++){if(!a[ks[i]]||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}
        const k=ks[ks.length-1];if(data===null)delete a[k];else if(patch&&typeof data==='object')a[k]=Object.assign(a[k]&&typeof a[k]==='object'?a[k]:{},data);else a[k]=data}
      st.ready=true;S.fbOk=true;fire()};
    es.addEventListener('put',h(false));es.addEventListener('patch',h(true));es.onerror=()=>{S.fbOk=false;renderStatus()};es.onopen=()=>{S.fbOk=true;renderStatus()};return st}
  const watch=(p,emit)=>{const st=stream(area(p)),ks=p.split('/');let last;
    const f=()=>{let v=st.cache;for(const k of ks){v=v&&typeof v==='object'?v[k]:undefined}if(v===undefined)v=null;const j=JSON.stringify(v);if(j===last)return;last=j;emit(v===null?null:JSON.parse(j))};
    st.subs.push(f);if(st.ready)f();return()=>{const i=st.subs.indexOf(f);if(i>=0)st.subs.splice(i,1)}};
  return{doc:p=>({get:async()=>{const v=await req('GET',p);return{exists:v!=null,data:()=>v}},set:d=>req('PUT',p,d),update:d=>req('PATCH',p,d),delete:()=>req('DELETE',p),onSnapshot:n=>watch(p,c=>n({exists:c!=null,data:()=>c}))}),
    collection:p=>({onSnapshot:n=>watch(p,c=>n({docs:Object.entries(c||{}).filter(([,v])=>v&&typeof v==='object').map(([id,v])=>({id,data:()=>v}))}))})}}

const SIMK=[['p1','Título'],['p2','Sumário executivo'],['p4','Análise de contexto'],['p5','Objetivo geral'],['p6','Público-alvo'],['p7','Metodologia'],['p11','Inovação e criatividade'],['p13','Alcance'],['p14','Visão de futuro']];
const SIM_MIN=0.4;
const simTxt=(t,k)=>k==='p5'?String(t.p5?.geral||''):String(t[k]||'');
const toks=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]{2,}/g)||[];
function shing(s){const w=toks(s),o=new Set();if(w.length<3){if(w.length)o.add(w.join(' '));return o}for(let i=0;i<=w.length-3;i++)o.add(w[i]+' '+w[i+1]+' '+w[i+2]);return o}
const shCache=new Map();
function shOf(key,txt){let e=shCache.get(key);if(!e||e.t!==txt){e={t:txt,s:shing(txt),n:toks(txt).length};shCache.set(key,e)}return e}
function simFor(t,k){const a=simTxt(t,k),min=k==='p1'?2:12;if(toks(a).length<min)return null;const A=shing(a);let best=null;
  const test=(B,den,name,y)=>{if(!den)return;let n=0;A.forEach(x=>{if(B.has(x))n++});const s=n/den;if(s>=SIM_MIN&&(!best||s>best.s))best={s,name,y}};
  for(const o of Object.values(teams())){if(!o||o.id===t.id)continue;const b=simTxt(o,k);if(toks(b).length<min)continue;const B=shing(b);test(B,Math.min(A.size,B.size),o.info?.startup||'',null)}
  for(const[aid,doc]of Object.entries(arqTxt()))for(const[tid,e]of Object.entries(doc||{})){if(!e||typeof e!=='object')continue;
    if(typeof e[k]==='string'){const c=shOf(aid+'/'+tid+'/'+k,e[k]);if(c.n>=min)test(c.s,Math.min(A.size,c.s.size),e.n||'',e.y||'anterior')}
    else if(typeof e.all==='string'&&k!=='p1'){const c=shOf(aid+'/'+tid+'/all',e.all);test(c.s,A.size,e.n||'',e.y||'anterior')}}
  return best}
const simAll=t=>SIMK.map(([k,l])=>({k,l,r:simFor(t,k)})).filter(x=>x.r);

function simNote(t,k){const r=SIMK.some(x=>x[0]===k)?simFor(t,k):null;if(!r)return'';

async function flush(){
  for(const id of Object.keys(dirty)){const keys=[...dirty[id]];if(!keys.length)continue;const t=T(id);dirty[id]=new Set();if(!t)continue;
    t.updatedAt=Date.now();
    if(isLocalTeam(id)||!S.db){saveLS();continue}
    const patch={updatedAt:t.updatedAt};keys.forEach(k=>patch[k]=clone(t[k]));
    try{await queue('teams/'+id,()=>S.db.doc('teams/'+id).update(patch))}
    catch(e){if(e&&e.code==='invalid_argument'){goLocal(id)}else{keys.forEach(k=>dirty[id].add(k));setSave('err');clearTimeout(saveT);saveT=setTimeout(flush,6000);return}}
  }
  setSave('ok');
}

function phase(c=cfg()){const n=new Date(),a=D(c.dtInscricao,c.hrInscricao),b=D(c.dtDefesa,c.hrDefesaIni),e=D(c.dtFinal,'23:59');
  return n<a?'elab':n<b?'analise':n<=e?'revisao':'fim'}

function newTeamObj(){return{id:uid(),createdAt:Date.now(),updatedAt:Date.now(),code:'',info:{org:'',startup:'',area:'',membros:[{nome:'',email:''},{nome:'',email:''}]},
  chk:{},p1:'',p2:'',p3:{},p4:'',p5:{geral:'',metas:['','','']},p6:'',p7:'',p8:{m1:[],m2:[],m3:[]},p9:[],p10:[],p11:'',p12:[],p13:'',p14:'',orc:[],refs:'',m2:{link:'',s:{}},envio:null,final:null}}
const arr=x=>Array.isArray(x)?x.filter(v=>v!=null):x&&typeof x==='object'?Object.values(x):[];
function norm(t){t.ilu||={};for(const k in t.ilu){t.ilu[k]=arr(t.ilu[k]);t.ilu[k].forEach(it=>{if(it.tipo!=='fig')it.rows=arr(it.rows).map(r=>arr(r).map(c=>c==null?'':String(c)))})}const b=newTeamObj();for(const k in b)if(k!=='id'&&t[k]==null)t[k]=b[k];t.info.membros||=[];t.p5.metas||=['','',''];['m1','m2','m3'].forEach(m=>t.p8[m]||=[]);t.m2.s||={};return t}
function orcSum(t){const r={by:{},bf:0,cp:0,op:0,tot:0};RUBS.forEach(x=>r.by[x.id]={bf:0,cp:0,op:0,tot:0});
  (t.orc||[]).forEach(i=>{const v=(+i.qtd||0)*(+i.unit||0),f=FONTES[i.fonte]?i.fonte:'bf',b=r.by[i.rub];if(!b)return;b[f]+=v;b.tot+=v;r[f]+=v;r.tot+=v});
  r.contra=r.cp+r.op;r.pct=r.bf?r.contra/r.bf*100:0;return r}
function orcIssues(t,c=cfg()){const o=orcSum(t),is=[];
  if(!o.tot)is.push('O orçamento ainda não tem itens.');
  if(o.bf>c.teto)is.push(`O valor solicitado (${brl(o.bf)}) passa do teto de ${brl(c.teto)} por proponente.`);
  if(o.bf&&o.pct<c.contrapartidaPct)is.push(`A contrapartida (${brl(o.contra)}, ${o.pct.toFixed(1)}%) está abaixo do mínimo de ${c.contrapartidaPct}% do valor solicitado (${brl(o.bf*c.contrapartidaPct/100)}).`);
  return is}
function filled(t,k){const v=t[k];switch(k){
  case'p3':return INST.filter(([f])=>(v?.[f]||'').trim()).length>=6;
  case'p5':return !!(v?.geral||'').trim()&&(v.metas||[]).some(m=>(m||'').trim());
  case'p8':return ['m1','m2','m3'].some(m=>(v?.[m]||[]).some(r=>(r.a||'').trim()&&/1/.test(r.m||'')));
  case'p9':case'p10':case'p12':return (v||[]).some(r=>Object.values(r).some(x=>String(x||'').trim()));
  case'orc':return orcSum(t).tot>0&&!orcIssues(t).length;
  case'm2':return !!(v?.link||'').trim();
  default:return !!String(v||'').trim()}}

function pend(t){const c=cfg(),p=[];SECS.filter(s=>!s.opt&&s.k!=='orc').forEach((s,i)=>{if(!filled(t,s.k))p.push(`Seção ${SECS.indexOf(s)+1}, ${s.t}: não preenchida.`)});
  if(words(t.p2)>300)p.push('Sumário executivo acima de 300 palavras.');if(words(t.p4)>1000)p.push('Análise de contexto acima de 1000 palavras.');
  orcIssues(t,c).forEach(x=>p.push(x));if(!filled(t,'m2'))p.push('Modelo 2: falta o link ou a indicação da apresentação.');return p}

function planSum(t){const m={};(t.orc||[]).forEach(i=>{const v=(+i.qtd||0)*(+i.unit||0),f=FONTES[i.fonte]?i.fonte:'bf';(m[linOf(i)]||={bf:0,op:0,cp:0})[f]+=v});return m}
function planHTML(t){const m=planSum(t),z={bf:0,op:0,cp:0},T={...z};let n=0;const row=(c,a,b,v)=>`<tr class="${c}"><td>${a}</td><td>${b}</td><td class="num">${brl(v.bf)}</td><td class="num">${brl(v.op)}</td><td class="num">${brl(v.cp)}</td><td class="num">${brl(v.bf+v.op+v.cp)}</td></tr>`;
  return`<div class="scroll"><table class="plan"><thead><tr><th>Nº</th><th>Discriminação</th><th class="num">BrazilFoundation</th><th class="num">Outros parceiros</th><th class="num">Contrapartida institucional</th><th class="num">Total</th></tr></thead><tbody>
  ${PLAN.map(([g,ls])=>{const s={...z};const body=ls.map(([l,nome])=>{const v=m[l]||z;['bf','op','cp'].forEach(k=>{s[k]+=v[k];T[k]+=v[k]});return row('',++n,esc(nome),v)}).join('');return`<tr class="grp"><td colspan="6">${g}</td></tr>${body}${row('sub','','Subtotal de '+g.toLowerCase(),s)}`}).join('')}
  ${row('tot','','Total geral',T)}<tr class="sub"><td></td><td>Total parceiros + contrapartida</td><td></td><td class="num" colspan="2">${brl(T.op+T.cp)}</td><td></td></tr></tbody></table></div>`}
const xmlEsc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
async function planXlsx(t){const zip=await JSZip.loadAsync(unb64(XLSX_B64)),f='xl/worksheets/sheet1.xml';let x=await zip.file(f).async('string');
  const setC=(ref,inner,extra='')=>{const re=new RegExp('<c r="'+ref+'"((?: s="\\d+")?)[^>]*?(?:/>|>[\\s\\S]*?</c>)');if(!re.test(x))throw new Error('célula '+ref);x=x.replace(re,(m0,s)=>inner?`<c r="${ref}"${s}${extra}>${inner}</c>`:`<c r="${ref}"${s}/>`)};
  if(t){const m=planSum(t);PLAN_OPTS.forEach(([l])=>{const v=m[l]||{};[['D','bf'],['E','op'],['F','cp']].forEach(([c,k])=>setC(c+l,v[k]?`<v>${Math.round(v[k]*100)/100}</v>`:''))});
    setC('D4',`<is><t>${xmlEsc(t.p1||t.info?.startup||'')}</t></is>`,' t="inlineStr"')}
  x=x.replace(/(<f[^>]*?(?:\/>|>[^<]*<\/f>))<v>[^<]*<\/v>/g,'$1');zip.file(f,x);
  const w='xl/workbook.xml';let wb=await zip.file(w).async('string');wb=/<calcPr/.test(wb)?wb.replace(/<calcPr(?![^>]*fullCalcOnLoad)/,'<calcPr fullCalcOnLoad="1"'):wb;zip.file(w,wb);
  if(zip.file('xl/calcChain.xml')){zip.remove('xl/calcChain.xml');for(const p of['[Content_Types].xml','xl/_rels/workbook.xml.rels']){let c=await zip.file(p).async('string');c=c.replace(/<Override[^>]*calcChain[^>]*\/>/,'').replace(/<Relationship[^>]*calcChain[^>]*\/>/,'');zip.file(p,c)}}
  return zip.generateAsync({type:'uint8array',compression:'DEFLATE'})}

  ${nu&&S.tab!=='msgs'?`<div class="note"><strong>${S.isProf?'A equipe respondeu.':'Nova mensagem do professor.'}</strong> <button class="btn gold sm" data-act="tab" data-v="msgs">Ler mensagens</button></div>`:''}

  <label class="f">${S.isProf?'Mensagem para a equipe':'Mensagem para o professor'}<textarea id="msg-txt" style="min-height:90px"></textarea></label><button class="btn" data-act="msg-send">Enviar mensagem</button></div>`}

   <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="new-addm" ${c.maxMembros&&n.info.membros.length>=c.maxMembros?'disabled':''}>Adicionar integrante</button><button class="btn" data-act="new-save">Cadastrar equipe</button></div>`

function chkRows(c=cfg()){return SECS.filter(s=>!s.opt).map((s,i)=>({k:s.k,l:`${i+1}. ${s.t}`})).concat([{k:'m2',l:'Elaborar o Modelo 2 resumido do projeto'},
  {k:'x1',l:'Apresentação parcial dos Modelos 1 e 2 ao professor',fix:c.dtParcial},{k:'x2',l:'Defesa pública do Modelo 2 do projeto',fix:c.dtDefesa},{k:'x3',l:'Entrega dos Modelos 1 e 2 aperfeiçoados após feedback',fix:c.dtFinal}])}
function tChecklist(t){const rows=chkRows(),done=rows.filter(r=>t.chk[r.k]?.s==='C').length;
  return`<div class="panel"><div class="row spread"><h3>Checklist de ações</h3><span class="tag ${done===rows.length?'ok':''}" id="chk-n">${done} de ${rows.length} concluídas</span></div>

  ${rows.map(r=>{const v=t.chk[r.k]||{};const f=r.fix?'':(filled(t,r.k)?'<span class="tag ok">preenchida</span>':'');return`<tr><td style="padding:10px 8px;font-weight:600">${esc(r.l)}</td><td data-l="Responsável(is)">${inp(`chk.${r.k}.r`,v.r,{list:'dl-m',al:'Responsável'})}</td>
   <td data-l="Prazo">${r.fix?`<input type="date" value="${r.fix}" disabled aria-label="Prazo do edital">`:inp(`chk.${r.k}.d`,v.d,{type:'date',al:'Prazo'})}</td><td data-l="Situação">${sel(`chk.${r.k}.s`,v.s||'',Object.entries(STS).slice(1),{blank:true,al:'Situação'}).replace('Selecione',r.fix?'A realizar':'A definir')}</td><td>${f}</td></tr>`}).join('')}
  </tbody></table></div></div>`}
function tProjeto(t){const s=SECS.find(x=>x.k===S.sec)||SECS[0],i=SECS.indexOf(s),dis=DIS();let body='';
  const wc=s.max?`<div class="small muted wc ${words(t[s.k])>s.max?'over':''}" data-wc="${s.k}" data-max="${s.max}">${words(t[s.k])} de ${s.max} palavras recomendadas no máximo</div>`:'';
  if(s.type==='line')body=`${inp(s.k,t[s.k],{dis,attr:'maxlength="110"',al:s.t})}`;
  else if(s.type==='text')body=ta(s.k,t[s.k],{cls:'tall',dis,al:s.t})+wc+(ILU_SECS.includes(s.k)?iluEd(t,s.k,dis):'');
  else if(s.type==='inst')body=INST.map(([f,l,big])=>`<label class="f">3.${INST.findIndex(x=>x[0]===f)+1} ${l}${big?ta('p3.'+f,t.p3[f],{dis}):inp('p3.'+f,t.p3[f]??(f==='nome'?'':''),{dis,ph:f==='nome'?t.info.org:''})}</label>`).join('');
  else if(s.type==='obj')body=`<label class="f">Objetivo geral${ta('p5.geral',t.p5.geral,{dis})}</label>${[0,1,2].map(j=>`<label class="f">Meta ${j+1}${j?' (opcional)':''}<span class="h">Quantifique: quanto, para quem, até quando.</span>${inp('p5.metas.'+j,t.p5.metas[j],{dis})}</label>`).join('')}`;
  else if(s.type==='table')body=tableEd(s.k,s.cols,t[s.k],dis);
  else if(s.type==='crono')body=tCrono(t,dis);
  else if(s.type==='orc')body=tOrc(t,dis);
  return`<div class="editor"><div class="secnav" role="tablist">${SECS.map((x,j)=>`<button data-act="sec" data-v="${x.k}" data-sec="${x.k}" aria-pressed="${x.k===s.k}"><span class="dot ${filled(t,x.k)?'on':''}"></span>${x.opt?'':j+1+'. '}${x.t}</button>`).join('')}</div>
  <div class="panel"><h3>${s.opt?'':i+1+'. '}${s.t}</h3><div class="muted">${s.q}</div>${s.help?`<p class="help">${s.help}</p>`:''}<div style="margin-top:14px">${body}</div><div id="sim-note">${simNote(t,s.k)}</div>
  <div class="row spread" style="margin-top:20px">${i?`<button class="btn ghost sm" data-act="sec" data-v="${SECS[i-1].k}">Seção anterior</button>`:'<span></span>'}${i<SECS.length-1?`<button class="btn sm" data-act="sec" data-v="${SECS[i+1].k}">Próxima seção</button>`:`<button class="btn sm" data-act="tab" data-v="m2">Ir para o Modelo 2</button>`}</div></div></div>`}
function tCrono(t,dis){const mm=meses();return['m1','m2','m3'].map((m,j)=>{const rows=t.p8[m];return`<h4 style="margin:14px 0 2px">Atividades da meta ${j+1}</h4><div class="small muted">${esc(t.p5.metas[j]||'Meta ainda não descrita na seção 5.')}</div>
 <div class="scroll"><table class="ed crono"><thead><tr><th>Atividade</th>${mm.map((x,k)=>`<th class="mm">M${k+1}</th>`).join('')}<th></th></tr></thead><tbody>
 ${rows.map((r,i)=>`<tr><td style="min-width:220px">${inp(`p8.${m}.${i}.a`,r.a,{dis,al:'Atividade'})}</td>${mm.map((_,k)=>`<td class="mm" data-l="M${k+1}"><input type="checkbox" class="mon" data-act-mon="${m}.${i}.${k}" ${(r.m||'')[k]==='1'?'checked':''} ${dis} aria-label="Mês ${k+1}"></td>`).join('')}<td>${dis?'':`<button class="x" data-act="delrow" data-key="p8.${m}" data-i="${i}" aria-label="Remover">×</button>`}</td></tr>`).join('')}
 </tbody></table></div>${dis?'':`<button class="btn ghost sm" data-act="addrow" data-key="p8.${m}" style="margin:6px 0 10px">Adicionar atividade</button>`}`}).join('')}
function orcSumHTML(t){const o=orcSum(t),c=cfg(),is=orcIssues(t,c);

  ${RUBS.map(r=>{const b=o.by[r.id];return`<tr><td>${r.id}. ${r.nome}</td><td class="num">${brl(b.bf)}</td><td class="num">${brl(b.op)}</td><td class="num">${brl(b.cp)}</td><td class="num">${brl(b.tot)}</td></tr>`}).join('')}</tbody>
  <tfoot><tr><td>Total geral</td><td class="num">${brl(o.bf)}</td><td class="num">${brl(o.op)}</td><td class="num">${brl(o.cp)}</td><td class="num">${brl(o.tot)}</td></tr></tfoot></table></div>
  <div class="row" style="margin-top:10px"><span class="tag ${o.bf>c.teto?'bad':'ok'}">Solicitado: ${brl(o.bf)} de ${brl(c.teto)}</span><span class="tag ${o.bf&&o.pct<c.contrapartidaPct?'bad':'ok'}">Parceiros + contrapartida: ${brl(o.contra)} (${o.pct.toFixed(1)}% do solicitado; mínimo ${c.contrapartidaPct}%)</span></div>
  ${is.map(x=>`<div class="note bad" style="margin:10px 0 0">${esc(x)}</div>`).join('')}`}
function tOrc(t,dis){return`<p class="help">Preveja todos os custos do projeto. Para cada item informe quantidade, valor unitário e quem paga: a patrocinadora, a contrapartida da organização ou outros parceiros. Indique também em que linha da planilha da patrocinadora o item entra; a página já sugere uma. Os totais, o consolidado e a planilha são calculados automaticamente.</p>
 <div class="note info"><strong>Como fazer o orçamento.</strong> Lancem tudo aqui na página e usem o Excel apenas como arquivo de entrega.
 <ol class="crit" style="margin-top:6px"><li>Lancem cada item na rubrica correspondente e confiram a linha da planilha sugerida para ele.</li>
 <li>Corrijam o que os avisos apontarem: valor solicitado acima do teto ou contrapartida abaixo do mínimo.</li>
 <li>Com o orçamento fechado, cliquem em "Baixar a planilha preenchida" e usem o arquivo na apresentação ou guardem como registro da equipe.</li></ol>
 Para mudar um valor depois, alterem aqui e baixem a planilha de novo. O que for editado direto no Excel não volta para a plataforma, não passa pela verificação das regras do edital e não é visto pelo professor. Para itens mensais, usem a quantidade como número de meses: um bolsista de R$ 1.200 por 12 meses entra como quantidade 12 e valor unitário 1200.</div>
 <h4>Orçamento consolidado</h4><div id="orc-sum" style="margin:8px 0 12px">${orcSumHTML(t)}</div>
 <details class="plan" ${S.planOpen?'open':''}><summary data-act="plan-tog">Planilha de solicitação de recursos (formato da patrocinadora)</summary><div id="plan-sum">${planHTML(t)}</div></details>
 <div class="row" style="margin:8px 0 20px"><button class="btn gold sm" data-act="plan-xlsx">Baixar a planilha preenchida (.xlsx)</button><button class="btn ghost sm" data-act="plan-blank">Baixar o modelo em branco (.xlsx)</button><span class="small muted">No Excel, as fórmulas de soma da planilha original continuam ativas.</span></div>
 ${RUBS.map(r=>{const rows=t.orc.map((x,i)=>[x,i]).filter(([x])=>x.rub===r.id);return`<h4 style="margin-top:18px">${r.id}. ${r.nome}</h4><div class="small muted">${r.desc}</div>
 <div class="scroll"><table class="ed"><thead><tr><th>Subitem</th><th>Descrição</th><th>Qtd.</th><th>Valor unitário (R$)</th><th>Quem paga</th><th>Linha da planilha</th><th class="num">Total</th><th></th></tr></thead><tbody>
 ${rows.map(([x,i])=>`<tr><td data-l="Subitem">${sel(`orc.${i}.sub`,x.sub,r.subs,{dis,al:'Subitem'})}</td><td data-l="Descrição" style="min-width:200px">${inp(`orc.${i}.desc`,x.desc,{dis,al:'Descrição'})}</td><td data-l="Quantidade" style="width:90px">${inp(`orc.${i}.qtd`,x.qtd,{type:'number',dis,attr:'min="0" step="any"',al:'Quantidade'})}</td><td data-l="Valor unitário (R$)" style="width:140px">${inp(`orc.${i}.unit`,x.unit,{type:'number',dis,attr:'min="0" step="0.01"',al:'Valor unitário'})}</td><td data-l="Quem paga">${sel(`orc.${i}.fonte`,x.fonte||'bf',Object.entries(FONTES),{dis,blank:false,al:'Quem paga'})}</td><td data-l="Linha da planilha">${sel(`orc.${i}.lin`,linOf(x),PLAN_OPTS,{dis,blank:false,al:'Linha da planilha'})}</td><td class="num" data-l="Total" data-rt="${i}" style="padding-top:11px">${brl((+x.qtd||0)*(+x.unit||0))}</td><td>${dis?'':`<button class="x" data-act="delrow" data-key="orc" data-i="${i}" aria-label="Remover">×</button>`}</td></tr>`).join('')}
 </tbody></table></div>${dis?'':`<button class="btn ghost sm" data-act="addorc" data-rub="${r.id}" style="margin-top:6px">Adicionar item em ${r.nome.toLowerCase()}</button>`}`}).join('')}`}
function tM2(t){const c=cfg(),dis=DIS(),n=SLIDES.filter((_,i)=>t.m2.s[i]).length;return`<div class="panel"><h3>Modelo 2: apresentação para a defesa</h3>
 <p class="help">Qualquer software serve; recomenda-se o Genially (genial.ly). São ${c.minDefesa} minutos de fala e ${c.minFeedback} de comentários. Evite poluição visual, divida as falas com tempo igual e capriche nos pontos ligados aos critérios do edital; os detalhes já estão no Modelo 1.</p>

function tDoc(t){const c=cfg(),ph=phase(c),p=pend(t);

  ${t.envio?(t.homol?`<div class="note ok"><strong>Inscrição confirmada pelo professor</strong> em ${fdt(t.homol.at)}. Envio da equipe em ${fdt(t.envio.at)}. A equipe pode continuar aprimorando o projeto até o fim do prazo; a inscrição continua valendo.${t.final?` Entrega da versão final confirmada em ${fdt(t.final.at)}.`:''}</div>`
   :`<div class="note"><strong>Envio confirmado em ${fdt(t.envio.at)}. Aguardando a confirmação do professor.</strong> Até lá, o projeto fica bloqueado para edição.</div>`)
  +(S.isProf?`<div class="row" style="margin-bottom:14px">${t.homol?'':`<button class="btn gold" data-act="homol" data-id="${t.id}">Confirmar inscrição e reabrir a edição</button>`}<button class="btn danger sm" data-act="homol-undo" data-id="${t.id}">Devolver à equipe (cancelar o envio)</button></div>`:''):'<div class="note"><strong>Envio ainda não confirmado.</strong> O projeto não está inscrito no edital.</div>'}

/* ============ documento (Modelo 1) ============ */
function docHTML(t,c=cfg()){const o=orcSum(t),mm=meses(c),P=s=>`<p>${esc(s||'')}</p>`,H=(k)=>{const s=SECS.find(x=>x.k===k);return`<h2>${SECS.indexOf(s)+1}. ${esc(s.t)}</h2>`};
  const tb=(cols,rows)=>`<table><tr>${cols.map(x=>`<th>${esc(x.l)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(x=>`<td>${esc(r[x.f])}</td>`).join('')}</tr>`).join('')}</table>`;
  return`<div class="lg"><img src="${LOGO_UFAM}" alt="UFAM" height="56"><div style="text-align:center"><b>Universidade Federal do Amazonas, Faculdade de Tecnologia</b><br>${esc(c.edicao)} ${esc(c.ano||'')}, ${esc(c.exercicio)}<br>Startup ${esc(t.info.startup)}: ${t.info.membros.filter(m=>m.nome).map(m=>esc(m.nome)).join(', ')}</div><img src="${LOGO_EP}" alt="Engenharia de Produção" height="56"></div>
  <h1>${esc(t.p1||'Título do projeto')}</h1>
  ${H('p2')}${P(t.p2)}${iluDoc(t,'p2')}${H('p3')}<table>${INST.map(([f,l],i)=>`<tr><th style="width:30%;text-align:left">3.${i+1} ${l}</th><td>${esc(t.p3[f]||(f==='nome'?t.info.org:''))}</td></tr>`).join('')}</table>
  ${H('p4')}${P(t.p4)}${iluDoc(t,'p4')}${H('p5')}<p><b>Objetivo geral:</b> ${esc(t.p5.geral)}</p>${t.p5.metas.map((m,i)=>m?`<p><b>Meta ${i+1}:</b> ${esc(m)}</p>`:'').join('')}
  ${H('p6')}${P(t.p6)}${iluDoc(t,'p6')}${H('p7')}${P(t.p7)}${iluDoc(t,'p7')}${H('p8')}
  ${['m1','m2','m3'].map((m,j)=>t.p8[m].length?`<table><tr><th style="text-align:left">Principais atividades da meta ${j+1}</th>${mm.map((_,k)=>`<th>M${k+1}</th>`).join('')}</tr>${t.p8[m].map(r=>`<tr><td>${esc(r.a)}</td>${mm.map((_,k)=>`<td style="text-align:center">${(r.m||'')[k]==='1'?'X':''}</td>`).join('')}</tr>`).join('')}</table>`:'').join('')}
  ${H('p9')}${tb(SECS[8].cols,t.p9)}${H('p10')}${tb(SECS[9].cols,t.p10)}${H('p11')}${P(t.p11)}${iluDoc(t,'p11')}${H('p12')}${tb(SECS[11].cols,t.p12)}${H('p13')}${P(t.p13)}${iluDoc(t,'p13')}${H('p14')}${P(t.p14)}${iluDoc(t,'p14')}
  ${H('orc')}<p><b>Orçamento consolidado</b></p><table><tr><th>Principais rubricas</th><th>Contrapartida (VC)</th><th>Outros parceiros</th><th>Solicitado (VS)</th><th>Subtotal</th></tr>
  ${RUBS.map(r=>{const b=o.by[r.id];return`<tr><td>${r.id}. ${r.nome}</td><td>${brl(b.cp)}</td><td>${brl(b.op)}</td><td>${brl(b.bf)}</td><td>${brl(b.tot)}</td></tr>`}).join('')}
  <tr><th style="text-align:left">Total</th><th>${brl(o.cp)}</th><th>${brl(o.op)}</th><th>${brl(o.bf)}</th><th>${brl(o.tot)}</th></tr></table>
  ${RUBS.map(r=>{const rows=t.orc.filter(x=>x.rub===r.id);return rows.length?`<p><b>Orçamento detalhado: ${r.nome.toLowerCase()}</b></p><table><tr><th>Item</th><th>Quantidade x valor</th><th>Contrapartida/parceiros</th><th>A solicitar</th></tr>${rows.map(x=>{const v=(+x.qtd||0)*(+x.unit||0);return`<tr><td>${esc(x.sub||'')} ${esc(x.desc||'')}</td><td>${esc(x.qtd)} x ${brl(x.unit)}</td><td>${x.fonte&&x.fonte!=='bf'?brl(v)+(x.fonte==='op'?' (parceiro)':''):''}</td><td>${!x.fonte||x.fonte==='bf'?brl(v):''}</td></tr>`}).join('')}</table>`:''}).join('')}
  ${t.refs?`<h2>Referencial teórico</h2>${P(t.refs)}`:''}${t.m2.link?`<h2>Modelo 2 (apresentação)</h2>${P(t.m2.link)}`:''}`}
const docFile=(t,c=cfg())=>`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(t.p1||t.info.startup)}</title><style>body{font:10.5pt/1.4 Arial,sans-serif;text-align:justify;max-width:17cm;margin:2cm auto}h1{font-size:14pt;text-align:center}h2{font-size:10.5pt;margin:14px 0 4px}table{border-collapse:collapse;width:100%;margin:6px 0;font-size:10pt}th,td{border:1px solid #444;padding:3px 5px}th{background:#e8eef0}p{white-space:pre-wrap;margin:4px 0}.lg{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444;padding-bottom:6px}</style></head><body>${docHTML(t,c)}</body></html>`;
const slug=s=>String(s||'equipe').normalize('NFD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').toLowerCase().slice(0,40)||'equipe';

/* ============ edições anteriores ============ */
function vArq(){const idx=Object.entries(arqIdx()).sort((a,b)=>b[1].at-a[1].at);
  if(S.arqId){const d=S.arq[S.arqId];if(!d){loadArq(S.arqId).then(x=>{if(!x){toast('Edição não encontrada.');S.arqId=null}render()},()=>{toast('Não foi possível carregar a edição.');S.arqId=null;render()});return'<p class="muted">Carregando edição…</p>'}
    const ts=Object.values(d.teams).sort((a,b)=>a.createdAt-b.createdAt),r=d.pub?.resultado?.rank||d.rank||[];
    if(S.arqTeam&&d.teams[S.arqTeam]){const t=d.teams[S.arqTeam];return`<div class="row" style="margin-bottom:12px"><button class="btn ghost sm" data-act="arq-team" data-id="">Voltar à edição ${esc(d.ano)}</button><button class="btn sm" data-act="arq-dl">Baixar este projeto (.html)</button>${t.pdf?`<button class="btn gold sm" data-act="leg-dl" data-id="${esc(t.pdf.id)}">Versão diagramada em PDF (${fsize(t.pdf.size)})</button>`:''}</div>
      <h2>${esc(t.p1||'Projeto sem título')}</h2><p class="muted">${esc(t.info.startup)} para ${esc(t.info.org)}, ${esc(d.edicao)} ${esc(d.ano)}</p><div class="scroll"><div class="doc">${docHTML(t,Object.assign({},DEF_CFG,d.cfg))}</div></div>`}
    return`<div class="row" style="margin-bottom:12px"><button class="btn ghost sm" data-act="arq-open" data-id="">Todas as edições</button></div>
    <section class="hero"><span class="ed-line">Edição encerrada em ${fdt(d.at)}</span><h2>${esc(d.edicao)} ${esc(d.ano)}</h2><p class="lead">Arquivo para consulta: ${ts.length} projeto(s) apresentados nesta edição. O conteúdo não pode mais ser alterado.</p></section>
    ${r.length?vResultadoPub({at:d.pub?.resultado?.at||d.at,rank:r}):''}
    <div class="panel"><h3>Projetos apresentados</h3>${ts.length?`<div class="grid g3">${ts.map(t=>`<button class="card" data-act="arq-team" data-id="${t.id}"><h4>${esc(t.p1||'Projeto sem título')}</h4><div class="small muted">${esc(t.info.startup)} para ${esc(t.info.org)}<br>${esc(t.info.area)}; ${t.info.membros.map(m=>esc(m.nome)).filter(Boolean).join(', ')}</div></button>`).join('')}</div>`:'<p class="muted">Nenhum projeto nesta edição.</p>'}</div>
    ${S.isProf?'<div class="row"><button class="btn ghost sm" data-act="arq-exp">Baixar esta edição (.json)</button><button class="btn danger sm" data-act="arq-del">Excluir esta edição do arquivo</button></div>':''}`}
  return`<h2 style="margin-bottom:6px">Edições anteriores</h2><p class="muted">Projetos das Mostras já encerradas, disponíveis para consulta de professores e alunos.</p>
  ${idx.length?`<div class="grid g3">${idx.map(([id,x])=>`<button class="card" data-act="arq-open" data-id="${esc(id)}"><div class="fig">${esc(x.ano)}</div><h4>${esc(x.edicao)}</h4><div class="small muted">${x.n} projeto(s); encerrada em ${fdt(x.at)}</div></button>`).join('')}</div>`:Object.keys(legado()).length?'':'<div class="panel"><p class="muted">Ainda não há edições arquivadas. Quando o professor encerrar uma Mostra, ela aparece aqui.</p></div>'}${vLegado()}`}
function legCard(id,x,adm){return`<div class="panel" style="margin:0"><h4>${esc(x.titulo)}</h4><div class="small muted" style="margin:4px 0 10px">${[x.startup,x.org&&'para '+x.org].filter(Boolean).map(esc).join(' ')}${x.membros?'<br>'+esc(x.membros):''}</div>
  <div class="row">${x.pdf?`<button class="btn sm" data-act="leg-dl" data-id="${esc(x.pdf.id)}">Projeto em PDF (${fsize(x.pdf.size)})</button>`:''}${x.xls?`<button class="btn gold sm" data-act="leg-dl" data-id="${esc(x.xls.id)}">Orçamento em Excel (${fsize(x.xls.size)})</button>`:''}${adm?`<button class="btn danger sm" data-act="leg-del" data-id="${esc(id)}">Excluir</button>`:''}</div>${adm&&!x.txt?'<div class="small muted" style="margin-top:6px">Texto do PDF não lido: fica fora da comparação de semelhança.</div>':''}</div>`}
function vLegado(adm){const L=Object.entries(legado()).sort((a,b)=>(b[1].ano-a[1].ano)||String(a[1].titulo).localeCompare(String(b[1].titulo)));if(!L.length)return'';const ys=[...new Set(L.map(([,x])=>x.ano))];

/* ============ ilustrações ============ */
function iluEd(t,k,dis){const L=iluList(t,k),lab=iluLabels(t);
  return`<div style="margin-top:18px"><h4>Figuras, tabelas e quadros desta seção</h4><p class="small muted">Aparecem ao final do texto da seção, numerados automaticamente. Cite-os no texto pelo número (por exemplo, "conforme a Figura 1").</p>
  ${L.map((it,i)=>{const p=`ilu.${k}.${i}`,fig=it.tipo==='fig',rows=it.rows||[],nc=rows[0]?rows[0].length:0;return`<div class="ilu"><div class="row spread"><strong>${esc(lab[it.id]||'')}</strong>${dis?'':`<button class="x" data-act="ilu-del" data-k="${k}" data-i="${i}" aria-label="Remover ilustração">×</button>`}</div>
   <div class="grid g2">${fig?'':`<label class="f">Tipo${sel(p+'.tipo',it.tipo,[['tab','Tabela (dados numéricos)'],['quadro','Quadro (informações em texto)']],{dis,blank:false})}</label>`}<label class="f">Título${inp(p+'.titulo',it.titulo,{dis,ph:'O que a ilustração mostra'})}</label><label class="f">Fonte${inp(p+'.fonte',it.fonte,{dis,ph:'Ex.: IBGE (2024) ou Elaborado pela equipe'})}</label></div>
   ${fig?`<img class="ilu-img" ${imgSrc(it)?`src="${esc(imgSrc(it))}"`:''} data-img="${esc(it.img||'')}" alt="${esc(it.titulo||'Figura')}">`
    :`<div class="scroll"><table class="grid-t"><tbody>${rows.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td>${inp(`${p}.rows.${ri}.${ci}`,c,{dis,al:`Linha ${ri+1}, coluna ${ci+1}`,ph:ri?'':'Cabeçalho'})}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
     ${dis?'':`<div class="row" style="margin-top:8px">${[['addr','Adicionar linha'],['addc','Adicionar coluna'],['delr','Remover última linha'],['delc','Remover última coluna']].map(([o,l])=>`<button class="btn ghost sm" data-act="ilu-tb" data-op="${o}" data-k="${k}" data-i="${i}" ${(o==='delr'&&rows.length<=2)||(o==='delc'&&nc<=1)||(o==='addc'&&nc>=10)||(o==='addr'&&rows.length>=40)?'disabled':''}>${l}</button>`).join('')}</div>`}`}</div>`}).join('')}
  ${dis?'':`<div class="row" style="margin-top:12px"><button class="btn sm" data-act="ilu-fig" data-k="${k}">Inserir figura</button><button class="btn ghost sm" data-act="ilu-tab" data-k="${k}">Inserir tabela ou quadro</button><span class="small muted">${figCount(t)} de ${MAX_FIG} figuras usadas no projeto</span><input type="file" id="ilu-file" accept="image/*" hidden></div>`}</div>`}
function iluDoc(t,k){const L=iluList(t,k);if(!L.length)return'';const lab=iluLabels(t);

/* ============ dashboard ============ */
function vDash(){const c=cfg(),ts=Object.values(teams()).map(norm).sort((a,b)=>String(a.info.startup).localeCompare(String(b.info.startup))),n=ts.length,rows=chkRows(c),now=new Date();
  const pr=ts.map(progress),os=ts.map(orcSum),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,sum=a=>a.reduce((x,y)=>x+y,0);
  const ins=ts.filter(t=>t.envio&&t.homol).length,agu=ts.filter(aguarda).length,fin=ts.filter(t=>t.final).length,mem=sum(ts.map(t=>t.info.membros.filter(m=>m.nome).length));
  const ck=ts.map(t=>{const o={C:0,E:0,P:0,N:0};rows.forEach(r=>{const s=t.chk[r.k]?.s;o[s==='C'||s==='E'||s==='P'?s:'N']++});return o});
  const bf=sum(os.map(o=>o.bf)),contra=sum(os.map(o=>o.contra)),tot=sum(os.map(o=>o.tot)),fora=ts.filter((t,i)=>os[i].tot&&orcIssues(t,c).length).length;

  const K=(cl,l,v,s='')=>`<div class="kpi ${cl}"><div class="l">${l}</div><div class="fig">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`,pc=x=>Math.round(x)+'%';
  const HB=(name,segs,val,mk)=>`<div class="hb"><div class="n" title="${esc(name)}">${esc(name)}</div><div class="t">${segs.map(([w,cl])=>`<i class="${cl}" style="width:${Math.max(0,Math.min(100,w))}%"></i>`).join('')}${mk!=null?`<span class="mk" style="left:${Math.min(100,mk)}%"></span>`:''}</div><div class="v">${val}</div></div>`;
  if(!n)return`<h2 style="margin-bottom:6px">Dashboard</h2><div class="panel"><p class="muted">Os indicadores aparecem aqui assim que a primeira equipe se cadastrar.</p></div>`;

  const rub=RUBS.map(r=>[r.nome,sum(os.map(o=>o.by[r.id].tot))]),mxo=Math.max(c.teto,...os.map(o=>o.bf))||1;
  return`<div class="row spread" style="margin-bottom:10px"><div><h2>Dashboard</h2><div class="muted">${esc(c.edicao)}, edição ${esc(c.ano)}. Indicadores das equipes, atualizados automaticamente.</div></div><span class="live">Ao vivo</span></div>
  <div class="kpis">${K('b','Equipes cadastradas',n,mem+' integrantes')}${K('g','Inscrições confirmadas',ins+' de '+n,agu?agu+' aguardando o professor':pc(ins/n*100)+' das equipes')}${K('v','Roteiro preenchido (média)',pc(avg(pr)),ts.filter((t,i)=>pr[i]===100).length+' equipe(s) com 100%')}${K('p','Checklist concluído (média)',pc(avg(ck.map(o=>o.C/rows.length*100))),sum(ck.map(o=>o.C))+' ações concluídas')}
   ${K('g','Total solicitado',brl(bf),pc(bf/(c.valorTotal||1)*100)+' do patrocínio de '+brl(c.valorTotal))}${K('v','Contrapartida e parceiros',brl(contra),bf?pc(contra/bf*100)+' do valor solicitado':'')}${K('p','Orçamentos fora das regras',fora,fora?'acima do teto ou sem contrapartida mínima':'todos dentro do edital')}${K('b',ms?'Próximo prazo':'Prazos',ms?Math.max(0,Math.ceil((ms[0]-now)/864e5))+' dias':'encerrados',ms?ms[1]+', '+fdate(ms[2]):'')}
   ${fin?K('v','Versões finais entregues',fin+' de '+n):''}</div>
  <div class="grid g2">

function ranking(){const c=cfg();let acc=0;return Object.values(teams()).map(norm).map(t=>({id:t.id,startup:t.info.startup,org:t.info.org,titulo:t.p1,bf:orcSum(t).bf,nota:nota(t.id,c)})).filter(x=>x.nota!=null).sort((a,b)=>b.nota-a.nota)

  case'code-reset':{if(!S.isProf)break;const x=T(d.id);if(!x)break;const sug=Math.random().toString(36).slice(2,8);
    const v=await ask({title:'Redefinir o código de '+x.info.startup,body:'Digite o novo código (mínimo de 4 caracteres) ou use o sugerido. O código anterior deixa de funcionar, e os integrantes precisarão digitar o novo para entrar.',input:sug,ok:'Redefinir código'});if(v==null)break;const nv=v.trim();if(nv.length<4){toast('Código muito curto.');break}
    x.code=hash(x.id+nv);markDirty(x.id,'code');await flush();await saveCode(x.id,nv);toast('Novo código de '+x.info.startup+': '+nv);render();break}
  case'ptab':S.ptab=d.v;if(d.v==='cfg')S.draft=null;render();break;
  case'leave':S.profEdit=false;S.asProf=false;await flush();S.teamId=null;render();break;
  case'enter':{S.asProf=false;const x=T(d.id);if(!x)break;if(!S.isProf&&!isMine(x)&&x.code){const v=await ask({title:'Entrar em '+x.info.startup,body:'Digite o código de acesso da equipe.',input:'',ok:'Entrar',type:'password'});if(v==null)break;if(hash(x.id+v)!==x.code){toast('Código incorreto.');break}addMine(x)}
    S.teamId=x.id;S.tab='cadastro';render();break}
  case'open':S.profEdit=false;S.asProf=true;S.teamId=d.id;S.view='equipe';S.tab=d.tab||'projeto';render();window.scrollTo(0,0);break;
  case'go-eval':S.evalId=d.id;S.ptab='aval';render();break;
  case'new-addm':S.newTeam.info.membros.push({nome:'',email:''});render();break;
  case'new-delm':S.newTeam.info.membros.splice(+d.i,1);render();break;
  case'new-save':{S.asProf=false;const n=S.newTeam;n.info.startup=n.info.startup.trim();n.info.org=n.info.org.trim();n.info.membros=n.info.membros.filter(m=>m.nome.trim());
    if(!n.info.startup||!n.info.org){toast('Informe o nome da startup e a organização-alvo.');render();break}
    if(!n.info.membros.length){toast('Inclua pelo menos um integrante.');n.info.membros=[{nome:'',email:''}];render();break}
    if((n.code||'').length<4){toast('O código de acesso precisa de pelo menos 4 caracteres.');break}
    if(Object.values(teams()).some(x=>x.info?.startup?.toLowerCase()===n.info.startup.toLowerCase())){toast('Já existe uma equipe com esse nome de startup.');break}
    const plain=n.code;n.code=hash(n.id+n.code);n.p3={nome:n.info.org};b.disabled=true;const where=await createTeam(n);addMine(n);saveCode(n.id,plain);S.newTeam=null;S.teamId=n.id;S.tab='checklist';
    toast(where==='shared'?'Equipe cadastrada.':'Equipe cadastrada neste navegador.');render();window.scrollTo(0,0);break}
  case'chcode':{const v=await ask({title:'Novo código de acesso',body:'Mínimo de 4 caracteres. Avise os demais integrantes.',input:'',ok:'Trocar código'});if(v==null)break;if(v.length<4){toast('Código muito curto.');break}t.code=hash(t.id+v);markDirty(t.id,'code');addMine(t);saveCode(t.id,v);toast('Código alterado.');break}
  case'addrow':{const arr=getP(t,d.key);if(d.key==='info.membros'&&c.maxMembros&&arr.length>=c.maxMembros&&!S.isProf){toast(`O limite é de ${c.maxMembros} integrantes.`);break}
    {const sc=SECS.find(x=>x.k===d.key);arr.push(d.key.startsWith('p8')?{a:'',m:'000000000000'}:d.key==='info.membros'?{nome:'',email:''}:Object.fromEntries((sc?.cols||[]).map(x=>[x.f,''])))}markDirty(t.id,d.key.split('.')[0]);render();break}
  case'delrow':getP(t,d.key).splice(+d.i,1);markDirty(t.id,d.key.split('.')[0]);render();break;
  case'addorc':t.orc.push({rub:d.rub,sub:'',desc:'',qtd:1,unit:'',fonte:'bf'});markDirty(t.id,'orc');render();break;
  case'submit':{if(t.envio&&!S.isProf)break;const p=pend(t);const ok=await ask({title:'Confirmar o envio para inscrição?',body:'Ao confirmar, a equipe declara que o Modelo 1 preenchido na plataforma e a apresentação indicada no Modelo 2 são a versão inscrita no edital. O projeto ficará bloqueado para edição até o professor confirmar a inscrição. Não é preciso enviar nada por e-mail.'+(p.length?`<br><br><strong>Ainda há ${p.length} pendência(s).</strong> Dá para confirmar assim mesmo e confirmar de novo até o fim do prazo, mas os avaliadores verão o projeto como estiver.`:''),ok:'Confirmar envio'});if(!ok)break;
    t.envio={at:Date.now(),n:(t.envio?.n||0)+1};markDirty(t.id,'envio');await flush();toast('Envio confirmado. Aguardem a confirmação do professor.');render();break}
  case'final':{const ok=await ask({title:'Confirmar a entrega da versão final?',body:'Ao confirmar, a equipe declara que o projeto na plataforma é a versão final, revisada após o feedback dos avaliadores. Não é preciso enviar nada por e-mail.',ok:'Confirmar entrega'});if(!ok)break;t.final={at:Date.now()};markDirty(t.id,'final');await flush();toast('Entrega da versão final confirmada.');render();break}
  case'dl-doc':await preload(t);saveFile(`modelo1-${slug(t.info.startup)}.html`,docFile(t));break;
  case'dl-json':saveFile(`equipe-${slug(t.info.startup)}.json`,JSON.stringify({kind:'mostra-equipe',at:Date.now(),team:t},null,1));break;
  case'del-team':{const x=T(d.id);const ok=await ask({title:'Excluir a equipe '+x.info.startup+'?',body:'Todo o conteúdo da equipe será apagado. Não dá para desfazer.',ok:'Excluir'});if(!ok)break;try{await deleteTeam(d.id);if(S.teamId===d.id)S.teamId=null;toast('Equipe excluída.')}catch(er){toast('Não foi possível excluir.')}render();break}
  case'crit-add':S.draft.criterios.push({id:'c'+uid(),sg:'',nome:'',desc:'',peso:1});render();break;
  case'crit-del':S.draft.criterios.splice(+d.i,1);render();break;
  case'cfg-save':{const x=S.draft;if(D(x.dtInscricao,x.hrInscricao)>D(x.dtDefesa,x.hrDefesaIni)||D(x.dtDefesa)>D(x.dtFinal)){toast('Confira as datas: inscrição, defesa e versão final precisam estar nessa ordem.');break}
    x.ordem=c.ordem||[];if(c.profHash)x.profHash=c.profHash;try{await saveCfg(x);S.draft=null;toast('Configurações salvas e publicadas.')}catch(er){toast('Não foi possível salvar as configurações.')}render();break}
  case'cfg-reset':{const ok=await ask({title:'Restaurar o edital original?',body:'Datas, valores e critérios voltam ao que está no edital anexado. Só vale depois de salvar.',ok:'Restaurar'});if(ok){S.draft=clone(DEF_CFG);if(c.profHash)S.draft.profHash=c.profHash;render()}break}
  case'ord':case'ord-sort':case'ord-all':case'ord-clear':{let o=agenda(c).map(x=>x.id);
    if(a==='ord'){const i=+d.i,j=i+(+d.d);[o[i],o[j]]=[o[j],o[i]]}
    else if(a==='ord-clear')o=[];
    else{o=Object.values(teams()).filter(x=>a==='ord-all'||(x.envio&&x.homol)).map(x=>x.id);if(!o.length){toast('Nenhuma equipe inscrita ainda.');break}for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}}
    try{await saveCfg(Object.assign({},c,{ordem:o}));if(S.draft)S.draft.ordem=o}catch(er){toast('Não foi possível salvar a ordem.')}render();break}
  case'pub-res':await savePub('resultado',{at:Date.now(),rank:ranking()});toast('Resultado publicado no edital.');render();break;
  case'unpub-res':await savePub('resultado',null);toast('Resultado retirado.');render();break;
  case'pub-fb':{const by={};Object.entries(evals()).forEach(([id,ev])=>{if((ev.coment||'').trim())by[id]=ev.coment});await savePub('feedback',{at:Date.now(),by});toast('Feedback liberado às equipes.');render();break}
  case'unpub-fb':await savePub('feedback',null);toast('Feedback ocultado.');render();break;
  case'exp-all':saveFile('mostra-projetos-solidarios-backup.json',JSON.stringify({kind:'mostra-backup',at:Date.now(),cfg:c,teams:teams(),evals:evals(),pub:pub(),msgs:msgs()},null,1));break;
  case'exp-csv':{const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',rows=[['Startup','Organização','Área','Integrantes','Título','Roteiro (%)','Solicitado','Outros parceiros','Contrapartida','Total','Contrapartida (%)','Inscrito em','Versão final em','Nota']];
    Object.values(teams()).map(norm).forEach(x=>{const o=orcSum(x),n=nota(x.id,c);rows.push([x.info.startup,x.info.org,x.info.area,x.info.membros.map(m=>m.nome).filter(Boolean).join(' | '),x.p1,progress(x),o.bf.toFixed(2),o.op.toFixed(2),o.cp.toFixed(2),o.tot.toFixed(2),o.pct.toFixed(1),fdt(x.envio?.at),fdt(x.final?.at),n==null?'':n.toFixed(2)])});
    saveFile('mostra-resumo.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'));break}
  }});
window.addEventListener('beforeunload',()=>{flush()});
Object.values(LS.teams).forEach(norm);
boot();

</script>
